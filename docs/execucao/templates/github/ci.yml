# CI/CD por serviço (B15, ADR-013). ADAPTAR: SERVICE, K8S_MANIFEST, e o passo de ffmpeg só no worker (E-06).
# Fixe as actions por SHA do commit ao copiar (T-12); as tags abaixo servem de referência de versão.
name: ci-cd
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
permissions:
  contents: read
  packages: read
  id-token: write
env:
  SERVICE: <svc>                        # ADAPTAR
  K8S_MANIFEST: k8s/<svc>.yaml          # ADAPTAR
  AWS_REGION: us-east-1
  NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable && yarn install --immutable
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - run: bash scripts/security-gate.sh

  quality:
    runs-on: ubuntu-latest
    needs: security-gate
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # - run: sudo apt-get update && sudo apt-get install -y ffmpeg   # SOMENTE no worker (E-06)
      - run: corepack enable && yarn install --immutable
      - run: yarn lint && yarn format:check && yarn depcruise
      - run: yarn test:cov            # unit + integration (Testcontainers), gate de 80%
      - run: yarn build
      - uses: SonarSource/sonarqube-scan-action@v6
        if: ${{ env.SONAR_TOKEN != '' }}
        env: { SONAR_TOKEN: "${{ secrets.SONAR_TOKEN }}" }

  image:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: |
          echo "$NPM_TOKEN" > /tmp/npm_token
          docker buildx build --secret id=npm_token,src=/tmp/npm_token -t $SERVICE:${{ github.sha }} --load .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.SERVICE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  deploy-homolog:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.ENABLE_OIDC_CD == 'true'
    runs-on: ubuntu-latest
    needs: image
    environment: homolog
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build & push
        run: |
          echo "$NPM_TOKEN" > /tmp/npm_token
          IMAGE=${{ steps.ecr.outputs.registry }}/fiapx-$SERVICE:sha-${GITHUB_SHA::7}
          docker buildx build --secret id=npm_token,src=/tmp/npm_token -t $IMAGE --push .
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
      - run: aws eks update-kubeconfig --name fiapx-homolog --region $AWS_REGION
      - name: Secrets (Secrets Manager → K8s Secret)
        run: |
          aws secretsmanager get-secret-value --secret-id fiapx/homolog/$SERVICE --query SecretString --output text > /tmp/s.json
          kubectl -n fiapx create secret generic $SERVICE-env --from-env-file=<(jq -r 'to_entries[]|"\(.key)=\(.value)"' /tmp/s.json) \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f /tmp/s.json
      - name: Migrate (exceto worker)
        if: env.SERVICE != 'video-worker'
        run: |
          sed "s#__IMAGE__#$IMAGE#g" k8s/migrate-job.yaml | kubectl -n fiapx apply -f -
          kubectl -n fiapx wait --for=condition=complete job/migrate-$SERVICE --timeout=180s
      - name: Rollout (undo em falha, AC-101)
        run: |
          sed "s#__IMAGE__#$IMAGE#g" $K8S_MANIFEST | kubectl apply -f -
          if ! kubectl -n fiapx rollout status deploy/$SERVICE --timeout=180s; then
            kubectl -n fiapx rollout undo deploy/$SERVICE; exit 1; fi
      - name: Smoke
        run: kubectl -n fiapx run smoke-$GITHUB_RUN_ID --rm -i --restart=Never --image=curlimages/curl -- curl -fsS http://$SERVICE.fiapx.svc:3000/health/ready

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: image
    permissions: { contents: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - name: Tag SemVer + GitHub Release (sem deploy, D20)
        run: |
          VERSION=v$(jq -r .version package.json)
          gh release create "$VERSION" --generate-notes --target master
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
