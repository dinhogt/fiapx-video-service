global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: alloy
    static_configs:
      - targets: ['alloy:12345']

  # Serviços (profile apps). Targets ficam DOWN até F2–F5; não quebram o /-/ready.
  - job_name: fiapx-services
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets:
          - auth-service:3000
          - video-service:3000
          - video-worker:3000
          - notification-service:3000
        labels:
          env: local

